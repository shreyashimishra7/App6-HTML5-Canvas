<head> 
	<title>App6---HTML5-Canvas</title>  

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes">

	<link rel="stylesheet" href="w3.css">
	<link rel="stylesheet" href="w3-colors-flat.css">
</head> 
<script>

// shows last update time
var docMod = document.lastModified;

// popup message
alert("This file last modified " + docMod);

// console message
console.log("This file last modified " + docMod); 
// draw rectangle
function drawRect(){

	// get canvas
	var canvas = document.getElementById("myCanvas");

	// get drawing tool
	var ctx = canvas.getContext("2d");

	// draw box
	ctx.fillStyle = "blue";
	ctx.fillRect(50,50,100,100);
}
// draw rectangle
function drawRect(){

	// get canvas
	var canvas = document.getElementById("myCanvas");

	// get drawing tool
	var ctx = canvas.getContext("2d");

	// draw box
	ctx.fillStyle = "blue";
	ctx.fillRect(50,50,100,100);
}
// draw name
function drawName(){

	// get canvas
	var canvas = document.getElementById("myCanvas");

	// get drawing tool
	var ctx = canvas.getContext("2d");

	// text style
	ctx.font = "20px Arial";

	// draw text
	ctx.fillText("Shreyashi", 50, 200);
}
// load image
function drawImage(){

	// get canvas
	var canvas = document.getElementById("myCanvas");

	// get drawing tool
	var ctx = canvas.getContext("2d");

	// make image
	var img = new Image();

	// image link
	img.src = "https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg";

	// draw after load
	img.onload = function(){
		ctx.drawImage(img, 50, 50, 150, 100);
	};
}
// clear canvas
function clearCanvas(){

	// get canvas
	var canvas = document.getElementById("myCanvas");

	// get drawing tool
	var ctx = canvas.getContext("2d");

	// clear everything
	ctx.clearRect(0, 0, canvas.width, canvas.height);
}
	</script>



<style>	
/* remove margin */
.body {
	margin: 0em;
}

/* page style */
.page {
	width: 100vw;
	height: 100vh;
	position: fixed;
	top: 0;
	left: -100vw;
	overflow-y: auto;
	z-index: 0;
	background-color: white;
}
/* show page */
.page:target {
	left: 0vw;
	z-index: 1;
}

/* canvas border */
canvas {
	border: 2px solid black;
}
</style>

<body>

<!-- header -->
<div id="header" class="w3-container w3-flat-carrot">
	<h1>Canvas App</h1>
</div>
	
<div id="content" class="w3-container">

	<!-- simple text -->
	<p>Press buttons to draw</p>

	<!-- canvas area -->
	<canvas id="myCanvas" width="300" height="300"></canvas>
<br><br>

	<!-- button 1 -->
	<button onclick="drawRect()" class="w3-button w3-blue">
		Draw Rectangle
	</button>

	<br><br>

	<!-- button 2 -->
	<button onclick="drawName()" class="w3-button w3-green">
		Draw Name
	</button>

	<br><br>

	<!-- button 3 -->
	<button onclick="drawImage()" class="w3-button w3-purple">
		Load Image
	</button>

	<br><br>

	<!-- button 4 -->
	<button onclick="clearCanvas()" class="w3-button w3-red">
		Clear Canvas
	</button>

	<!-- disclaimer -->
	<p>
	This is for learning only.
	</p>
